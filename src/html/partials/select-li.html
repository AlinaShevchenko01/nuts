<li
        class="custom-select__option">

    <label class="custom-select__input-label" >
        <input class="custom-select__checkbox"
               type="checkbox"
               value="{{value}}">

        <span class="custom-select__input-text">{{text}}</span>

        <span class="custom-select__input-checkbox">
                {{> templates/svg-manager id="icon-checkmark"
        svg-class="custom-select__checkmark" width="14px" height="12px"}}
            </span>
    </label>
</li>
