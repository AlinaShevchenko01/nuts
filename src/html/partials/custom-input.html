<div class="custom-input {{input-class}}">
    <input class="custom-input__input"
    id="{{input-id}}"
    type="{{input-type}}"
           name="{{input-name}}"
    placeholder=" ">

    <label class="custom-input__label"
            for="{{input-id}}">
        {{label-text}}
    </label>

    <span class="custom-input__error">
        Заполните, пожалуйста, это поле. {{error-text}}
    </span>
</div>
